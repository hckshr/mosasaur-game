<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Mosasaur: Lost in the Deep</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#04203a;font-family:'Fredoka',system-ui,sans-serif;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
canvas{display:block;width:100vw;height:100vh}
#controls{position:fixed;right:18px;bottom:18px;display:none;flex-direction:column;gap:14px;align-items:center;z-index:5}
.round{width:88px;height:88px;border-radius:50%;border:3px solid rgba(255,255,255,.75);background:rgba(10,60,100,.45);color:#fff;font:700 16px 'Fredoka',sans-serif;letter-spacing:.5px;touch-action:none}
.round:active{background:rgba(255,200,80,.55)}
.round.small{width:70px;height:70px;font-size:14px;background:rgba(80,40,140,.45)}
#corner{position:fixed;left:12px;bottom:12px;display:none;gap:10px;z-index:5}
.mini{width:46px;height:46px;border-radius:14px;border:2px solid rgba(255,255,255,.6);background:rgba(10,40,70,.5);color:#fff;font-size:20px}
.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(2,16,32,.55);z-index:10;padding:16px;box-sizing:border-box}
.card{background:linear-gradient(#1d77a8,#0b3a63);color:#fff;border:3px solid #8fe3ff;border-radius:24px;padding:22px 24px;max-width:min(460px,92vw);max-height:90vh;overflow:auto;text-align:center;box-shadow:0 12px 50px rgba(0,0,0,.55)}
.card h1{margin:0 0 8px;font-size:34px;line-height:1.05;color:#ffe27a;text-shadow:0 3px 0 #0a2a48}
.card h1 span{display:block;font-size:20px;color:#bff2ff}
.card h2{margin:0 0 10px;font-size:26px;color:#ffe27a}
.card p{font-size:17px;line-height:1.4;margin:8px 0}
.card ul{text-align:left;padding-left:0;list-style:none;font-size:16px;line-height:1.35;margin:12px 0}
.card li{margin:6px 0}
.card .ctrl{font-size:14px;opacity:.85}
.card button{margin-top:12px;font:700 22px 'Fredoka',sans-serif;color:#0b3a63;background:#ffe27a;border:none;border-radius:16px;padding:12px 30px;box-shadow:0 4px 0 #b8901f;cursor:pointer}
.card button:active{transform:translateY(3px);box-shadow:0 1px 0 #b8901f}
.gem{font-size:46px;line-height:1}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="controls">
  <button class="round small" id="bSonar">SONAR</button>
  <button class="round" id="bDash">DASH<br>BITE</button>
</div>
<div id="corner">
  <button class="mini" id="bMute" aria-label="Sound">🔊</button>
  <button class="mini" id="bPause" aria-label="Pause">⏸</button>
</div>
<div class="overlay" id="ov"><div class="card" id="card"></div></div>
<script>
(()=>{
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W=0,H=0,DPR=1,scale=1;
const TOUCH=('ontouchstart' in window)||matchMedia('(pointer:coarse)').matches;
function resize(){DPR=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;scale=Math.max(0.45,Math.min(1.3,Math.sqrt(W*H)/820));}
addEventListener('resize',resize);resize();

const rand=(a,b)=>a+Math.random()*(b-a);
const dist=(ax,ay,bx,by)=>Math.hypot(ax-bx,ay-by);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
function angLerp(a,b,t){let d=(((b-a)%(Math.PI*2))+Math.PI*3)%(Math.PI*2)-Math.PI;return a+d*t;}

// ---------- WORLD ----------
const WW=6400,WH=1900;
function rawFloor(x){
  let y=1250+110*Math.sin(x/530)+60*Math.sin(x/210+1)+25*Math.sin(x/77+2);
  y+=480*Math.exp(-(((x-2550)/320)**2))+320*Math.exp(-(((x-5600)/420)**2));
  y-=430*Math.exp(-(((x-250)/450)**2));
  return Math.min(y,WH-40);
}
const FL=new Float32Array(WW/10+2);for(let i=0;i<FL.length;i++)FL[i]=rawFloor(i*10);
function fy(x){x=clamp(x,0,WW);const i=Math.floor(x/10),f=x/10-i;return FL[i]*(1-f)+FL[Math.min(i+1,FL.length-1)]*f;}
const NEST={x:270,y:fy(270)-70};

const FACTS=[
 ["Not a dinosaur!","Mosasaurs were giant sea <b>reptiles</b>, not dinosaurs. Their closest cousins are lizards and snakes."],
 ["Air breathers","Mosasaurs breathed <b>air</b>, just like you. They had to swim up to the surface to take a breath. So do you in this game!"],
 ["Super size","The biggest mosasaurs grew around <b>50 feet (15 m)</b> long. That's longer than a school bus!"],
 ["Extra teeth","Mosasaurs had a <b>second row of teeth</b> on the roof of their mouth to help hold on to slippery prey."],
 ["Shark-like tail","Fossils show mosasaurs had a <b>tail fin</b> that bent downward, a bit like a shark's tail."],
 ["Live babies","Mosasaurs didn't lay eggs on a beach. They gave birth to <b>live babies</b> right in the water."],
 ["Long ago","Mosasaurs lived about <b>98 to 66 million years ago</b>, in the Late Cretaceous, at the same time as T. rex."],
 ["What's in a name?","\"Mosasaur\" means <b>Meuse lizard</b>. The first one was found near the Meuse River in the Netherlands."]
];

let P,fish,schools,ammos,sharks,babies,crystals,kelp,rocks,corals,parts,rings,toasts,cam,stats,winT,flags,snow;
let state='title',T=0;

function makeSpine(o,n,seg){o.spine=[];o.seg=seg;for(let i=0;i<n;i++)o.spine.push({x:o.x-i*seg,y:o.y});}
function updateSpine(o){const sp=o.spine;sp[0].x=o.x;sp[0].y=o.y;for(let i=1;i<sp.length;i++){const a=sp[i-1],b=sp[i];const dx=b.x-a.x,dy=b.y-a.y;const d=Math.hypot(dx,dy)||1;b.x=a.x+dx/d*o.seg;b.y=a.y+dy/d*o.seg;}}

function newGame(){
  P={x:NEST.x+120,y:NEST.y-120,vx:2,vy:0,ang:0,s:1,hp:100,air:100,dash:0,dashCd:0,inv:0,mouth:0,mouthT:0,inWater:true,sonarT:0,sonarCd:0,bubT:0,beepT:0};
  makeSpine(P,16,9);
  schools=[];fish=[];
  const cols=['#ffd34d','#cfe6f2','#ff9f5a','#9fe0ff','#c6f27a'];
  for(let i=0;i<13;i++){const x=600+i*450+rand(-100,100);const sc={bx:x,by:rand(150,fy(x)-170),ph:rand(0,6),x:0,y:0,col:cols[i%cols.length]};schools.push(sc);
    for(let j=0;j<7;j++)fish.push({x:x+rand(-60,60),y:sc.by+rand(-40,40),vx:rand(-1,1),vy:0,sc,ph:rand(0,6),size:rand(7,10),alive:true,respawn:0});}
  ammos=[];for(let i=0;i<15;i++){const x=rand(700,WW-200);ammos.push({x,y:rand(200,fy(x)-90),ph:rand(0,6),alive:true,respawn:0,r:rand(11,15)});}
  sharks=[];[1600,2050,2750,3450,4150,4850,5550,6050].forEach(x=>{const y=rand(320,fy(x)-200);sharks.push({x,y,hx:x,hy:y,vx:0,vy:0,ph:rand(0,6),dizzy:0,retreat:0,face:1,ang:0});});
  babies=[];[[2560,fy(2560)-70],[4300,880],[5900,fy(5900)-75]].forEach((p,i)=>{const b={x:p[0],y:p[1],bx:p[0],by:p[1],vx:0,vy:0,s:1,ph:i*2,state:'lost',order:0,bubT:0};makeSpine(b,14,4);babies.push(b);});
  crystals=[];[[720,480],[1500,900],[2540,1450],[3300,420],[3900,1080],[4700,640],[5560,1500],[6150,520]].forEach((p,i)=>{crystals.push({x:p[0],y:Math.min(p[1],fy(p[0])-90),found:false,fact:i,ph:rand(0,6)});});
  kelp=[];for(let i=0;i<170;i++){const x=rand(20,WW-20);kelp.push({x,h:rand(60,220)*(x<700?1.3:1),ph:rand(0,6),c:Math.random()<.5?'#2f8a4a':'#3e9e3a'});}
  rocks=[];for(let i=0;i<80;i++){const x=rand(0,WW);rocks.push({x,rx:rand(25,80),ry:rand(15,40),c:Math.random()<.5?'#1c3442':'#243f4e'});}
  corals=[];for(let i=0;i<34;i++){const x=rand(40,560);corals.push({x,y:fy(x)+4,r:rand(10,26),c:['#ff7aa8','#ffb04d','#c77dff','#ff5e7e','#ffe27a','#6ff0d4'][i%6],ph:rand(0,6)});}
  snow=[];for(let i=0;i<90;i++)snow.push({x:rand(0,3000),y:rand(0,3000),s:rand(1,2.6)});
  parts=[];rings=[];toasts=[];
  cam={x:0,y:0};
  stats={time:0,fish:0,sharks:0,crystals:0};
  flags={};winT=-1;
  updateSpine(P);
  cam.x=P.x-W/scale/2;cam.y=P.y-H/scale/2;
}

// ---------- AUDIO ----------
let AC=null,muted=false;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function tone(f,dur,type='sine',vol=.15,to=null,delay=0){if(muted||!AC)return;const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+dur);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur+.05);}
function noise(dur,vol,freq){if(muted||!AC)return;const t=AC.currentTime,n=Math.floor(AC.sampleRate*dur),buf=AC.createBuffer(1,n,AC.sampleRate),d=buf.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);const s=AC.createBufferSource();s.buffer=buf;const fl=AC.createBiquadFilter();fl.type='bandpass';fl.frequency.value=freq;fl.Q.value=.8;const g=AC.createGain();g.gain.value=vol;s.connect(fl);fl.connect(g);g.connect(AC.destination);s.start(t);}
const SFX={
  chomp(){tone(340,.12,'square',.07,110);},
  dash(){noise(.3,.35,700);},
  sonar(){tone(1500,.5,'sine',.12,650);tone(1500,.5,'sine',.05,650,.38);tone(1500,.5,'sine',.025,650,.76);},
  gem(){[660,880,1320,1760].forEach((f,i)=>tone(f,.25,'triangle',.1,null,i*.08));},
  hurt(){tone(200,.35,'sawtooth',.09,70);},
  bonk(){tone(500,.15,'square',.08,900);tone(700,.2,'triangle',.06,1200,.08);},
  splash(){noise(.4,.5,1200);},
  baby(){tone(900,.12,'sine',.12,1300);tone(1000,.14,'sine',.12,1500,.15);},
  home(){[523,659,784].forEach((f,i)=>tone(f,.3,'triangle',.12,null,i*.1));},
  win(){[523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,.35,'triangle',.12,null,i*.13));},
  beep(){tone(700,.12,'sine',.08);tone(700,.12,'sine',.08,null,.18);}
};

// ---------- INPUT ----------
const keys={};
addEventListener('keydown',e=>{
  keys[e.code]=true;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();
  if(state==='play'){
    if(e.code==='Space'||e.code==='KeyJ')tryDash();
    if(e.code==='KeyE'||e.code==='KeyQ'||e.code==='KeyK')trySonar();
    if(e.code==='KeyP'||e.code==='Escape')pause();
  } else if(e.code==='Enter'||e.code==='Space'){const b=document.querySelector('#card button');if(b&&ov.style.display==='flex')b.click();}
});
addEventListener('keyup',e=>{keys[e.code]=false;});
const steer={on:false,id:null,x:0,y:0};
cv.addEventListener('pointerdown',e=>{if(steer.on)return;steer.on=true;steer.id=e.pointerId;steer.x=e.clientX;steer.y=e.clientY;try{cv.setPointerCapture(e.pointerId);}catch(_){} });
cv.addEventListener('pointermove',e=>{if(steer.on&&e.pointerId===steer.id){steer.x=e.clientX;steer.y=e.clientY;}});
const endSteer=e=>{if(e.pointerId===steer.id){steer.on=false;steer.id=null;}};
cv.addEventListener('pointerup',endSteer);cv.addEventListener('pointercancel',endSteer);
function bindBtn(id,fn){const b=document.getElementById(id);b.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();fn();});}
bindBtn('bDash',()=>{if(state==='play')tryDash();});
bindBtn('bSonar',()=>{if(state==='play')trySonar();});
bindBtn('bMute',()=>{muted=!muted;document.getElementById('bMute').textContent=muted?'🔇':'🔊';});
bindBtn('bPause',()=>{if(state==='play')pause();});

function tryDash(){
  if(P.dashCd>0)return;
  const a=Math.hypot(P.vx,P.vy)>.5?Math.atan2(P.vy,P.vx):P.ang;
  if(!P.inWater)return;
  P.vx=Math.cos(a)*12;P.vy=Math.sin(a)*12;P.dash=.42;P.dashCd=.75;P.mouthT=.45;SFX.dash();
  for(let i=0;i<8;i++)parts.push({x:P.x,y:P.y,vx:rand(-1,1),vy:rand(-1.5,0),life:rand(.6,1.2),max:1.2,type:'bub',size:rand(2,5)});
}
function trySonar(){
  if(P.sonarCd>0)return;
  P.sonarCd=1.2;P.sonarT=5;rings.push({x:P.x,y:P.y,r:10,life:1.4});SFX.sonar();
  if(!flags.sonar){flags.sonar=1;toast('The arrows point to your lost babies!');}
}
function toast(txt,dur=3.6){if(toasts.length&&toasts[toasts.length-1].txt===txt)return;toasts.push({txt,t:dur});}

// ---------- OVERLAYS ----------
const ov=document.getElementById('ov'),card=document.getElementById('card');
function showCard(html){card.innerHTML=html;ov.style.display='flex';const b=card.querySelector('button');if(b)b.addEventListener('click',()=>{ac();act(b.dataset.a);});}
function hideCard(){ov.style.display='none';}
function act(a){
  if(a==='start'){newGame();hideCard();startPlay();toast('Find your 3 lost babies!',3.5);toast(TOUCH?'Tap SONAR to see where they are.':'Press E for sonar to see where they are.',4);}
  else if(a==='resume'){hideCard();startPlay();}
  else if(a==='respawn'){respawn();hideCard();startPlay();}
  else if(a==='again'){act('start');}
}
function startPlay(){state='play';steer.on=false;for(const k in keys)keys[k]=false;document.getElementById('controls').style.display=TOUCH?'flex':'none';document.getElementById('corner').style.display='flex';}
function stopPlay(s){state=s;document.getElementById('controls').style.display='none';}
function pause(){stopPlay('paused');showCard(`<h2>Paused</h2><p>Babies home: ${babies.filter(b=>b.state==='home').length} / 3<br>Crystals found: ${stats.crystals} / 8</p><button data-a="resume">Keep Swimming</button>`);}
function titleCard(){
  showCard(`<h1>Mosasaur<span>Lost in the Deep</span></h1>
  <p>Your 3 babies wandered off into the deep Cretaceous sea! Find them and lead them home to the reef.</p>
  <ul>
  <li>🫧 You breathe <b>air</b>. Swim up to the surface to fill your air bar.</li>
  <li>🐟 Eat fish and ammonites to stay strong.</li>
  <li>🦈 Dash-bite sharks to scare them away. The home reef is a safe zone.</li>
  <li>💎 Touch glowing crystals to learn real mosasaur facts.</li>
  <li>🚀 Dash up through the surface to leap out of the water!</li>
  </ul>
  <p class="ctrl">${TOUCH?'Hold your finger on the screen and Mosa swims toward it. Tap DASH to zoom and bite. Tap SONAR to find babies.':'Arrow keys or WASD to swim · Space to dash-bite · E for sonar · P to pause'}</p>
  <button data-a="start">Dive In!</button>`);
}
function respawn(){
  P.x=NEST.x+100;P.y=NEST.y-120;P.vx=1;P.vy=0;P.hp=100;P.air=100;P.inv=2;P.dash=0;makeSpine(P,16,9);updateSpine(P);
  babies.forEach(b=>{if(b.state==='following'){b.x=P.x-80;b.y=P.y;makeSpine(b,14,4);}});
}

// ---------- UPDATE ----------
function update(dt){
  const fr=dt*60;stats.time+=dt;
  // input
  let ix=0,iy=0,mag=0;
  if(keys.ArrowLeft||keys.KeyA)ix-=1;if(keys.ArrowRight||keys.KeyD)ix+=1;if(keys.ArrowUp||keys.KeyW)iy-=1;if(keys.ArrowDown||keys.KeyS)iy+=1;
  mag=Math.hypot(ix,iy);if(mag>0){ix/=mag;iy/=mag;mag=1;}
  if(steer.on){const px=(P.x-cam.x)*scale,py=(P.y-cam.y)*scale;const dx=steer.x-px,dy=steer.y-py,d=Math.hypot(dx,dy);if(d>14){ix=dx/d;iy=dy/d;mag=Math.min(1,d/110);}else mag=0;}

  // player physics
  const prevY=P.y;
  P.inWater=P.y>0;
  if(P.inWater){
    const max=4.6,k=(P.dash>0?.02:(mag>0?.075:.03))*fr;
    P.vx+=(ix*mag*max-P.vx)*k;P.vy+=(iy*mag*max-P.vy)*k;
  } else {
    P.vy+=.32*fr;P.vx+=ix*.04*fr;
  }
  P.x+=P.vx*fr;P.y+=P.vy*fr;
  if(P.x<60){P.x=60;P.vx=Math.abs(P.vx)*.3;} if(P.x>WW-60){P.x=WW-60;P.vx=-Math.abs(P.vx)*.3;}
  const fl=fy(P.x)-14;if(P.y>fl){P.y=fl;if(P.vy>0)P.vy*=-.3;}
  if(P.y<-900)P.y=-900;
  if((prevY>0)!==(P.y>0)){splash(P.x,Math.abs(P.vy));if(P.y<0&&!flags.leap&&P.vy<-7){flags.leap=1;toast('Whoa, what a leap!',2.5);}}
  P.dash=Math.max(0,P.dash-dt);P.dashCd=Math.max(0,P.dashCd-dt);P.inv=Math.max(0,P.inv-dt);P.sonarCd=Math.max(0,P.sonarCd-dt);P.sonarT=Math.max(0,P.sonarT-dt);P.mouthT=Math.max(0,P.mouthT-dt);
  const sp=Math.hypot(P.vx,P.vy);
  if(sp>.3)P.ang=angLerp(P.ang,Math.atan2(P.vy,P.vx),Math.min(1,.2*fr));
  const c=Math.cos(P.ang);if(c>.15)P.s=1;else if(c<-.15)P.s=-1;
  P.mouth+=((P.mouthT>0?1:.08)-P.mouth)*Math.min(1,.3*fr);
  updateSpine(P);
  const hx=P.x+Math.cos(P.ang)*42,hy=P.y+Math.sin(P.ang)*42;
  // bubbles
  P.bubT-=dt;if(P.inWater&&P.bubT<=0){P.bubT=rand(.3,.9);parts.push({x:hx,y:hy-6,vx:rand(-.3,.3),vy:-.6,life:2.5,max:2.5,type:'bub',size:rand(2,4)});}
  // air & health
  if(P.y<28)P.air=Math.min(100,P.air+45*dt);else P.air=Math.max(0,P.air-2.4*dt);
  if(P.air<35&&!flags.air){flags.air=1;toast('Mosasaurs breathe air! Swim up to the surface.',4.5);}
  if(P.air<20&&P.y>28){P.beepT-=dt;if(P.beepT<=0){P.beepT=1.6;SFX.beep();}}
  if(P.air<=0)P.hp-=7*dt;
  const safe=dist(P.x,P.y,NEST.x,NEST.y)<480;

  // schools
  for(const s of schools){s.x=s.bx+Math.sin(T*.13+s.ph)*220;s.y=clamp(s.by+Math.sin(T*.21+s.ph)*80,80,fy(s.bx)-60);}
  for(const f of fish){
    if(!f.alive){f.respawn-=dt;if(f.respawn<=0){const s=schools[(Math.random()*schools.length)|0];if(dist(s.x,s.y,P.x,P.y)>700){f.sc=s;f.x=s.x+rand(-60,60);f.y=s.y+rand(-30,30);f.vx=0;f.vy=0;f.alive=true;}else f.respawn=1;}continue;}
    const s=f.sc;let ax=(s.x+Math.cos(T*.9+f.ph)*55-f.x)*.002,ay=(s.y+Math.sin(T*1.1+f.ph)*30-f.y)*.002;
    const d=dist(f.x,f.y,P.x,P.y),scared=d<230&&P.inWater;
    if(scared){ax+=(f.x-P.x)/d*.25;ay+=(f.y-P.y)/d*.25;}
    f.vx+=ax*fr;f.vy+=ay*fr;const v=Math.hypot(f.vx,f.vy),mx=scared?3.7:1.6;if(v>mx){f.vx*=mx/v;f.vy*=mx/v;}
    f.x=clamp(f.x+f.vx*fr,20,WW-20);f.y+=f.vy*fr;
    if(f.y<30){f.y=30;f.vy=Math.abs(f.vy);}const ff=fy(f.x)-20;if(f.y>ff){f.y=ff;f.vy=-Math.abs(f.vy);}
    if(dist(f.x,f.y,hx,hy)<30){f.alive=false;f.respawn=8;P.hp=Math.min(100,P.hp+7);P.mouthT=.25;stats.fish++;SFX.chomp();burst(f.x,f.y,5);}
  }
  for(const a of ammos){
    if(!a.alive){a.respawn-=dt;if(a.respawn<=0&&dist(a.x,a.y,P.x,P.y)>700)a.alive=true;continue;}
    a.x+=Math.sin(T*.2+a.ph)*.3*fr;a.y+=Math.sin(T*.9+a.ph)*.25*fr;
    if(dist(a.x,a.y,hx,hy)<32){a.alive=false;a.respawn=15;P.hp=Math.min(100,P.hp+15);P.mouthT=.3;SFX.chomp();burst(a.x,a.y,8);if(!flags.ammo){flags.ammo=1;toast('Yum! Ammonites are extra filling.',3);}}
  }
  // sharks
  for(const s of sharks){
    const d=dist(s.x,s.y,P.x,P.y),dh=dist(s.x+Math.cos(s.ang)*40,s.y+Math.sin(s.ang)*40,hx,hy);
    let tx,ty,spd,k=.04;
    if(P.dash>0&&s.dizzy<=0&&(dh<75||dist(s.x,s.y,hx,hy)<70)){s.dizzy=4;s.retreat=7;stats.sharks++;SFX.bonk();burst(s.x,s.y-20,10,'#fff6a0');if(!flags.bonk){flags.bonk=1;toast('Chomp! That shark won\'t bother you for a while.',3);}}
    s.dizzy=Math.max(0,s.dizzy-dt);s.retreat=Math.max(0,s.retreat-dt);
    if(s.dizzy>0){tx=s.x+Math.cos(T*2)*20;ty=s.y+8;spd=.6;}
    else if(s.retreat>0){const dd=d||1;tx=s.x+(s.x-P.x)/dd*100;ty=s.y+(s.y-P.y)/dd*100;spd=3;}
    else if(d<430&&P.inWater&&!safe&&P.inv<=0){tx=P.x;ty=P.y;spd=3.1;k=.05;
      if(d<58){P.hp-=18;P.inv=1.6;const dd=d||1;P.vx+=(P.x-s.x)/dd*7;P.vy+=(P.y-s.y)/dd*7;s.retreat=2.5;SFX.hurt();burst(P.x,P.y,6,'#ffb0b0');if(!flags.hurt){flags.hurt=1;toast(TOUCH?'Ouch! Tap DASH to bite sharks and scare them off.':'Ouch! Press Space to dash-bite sharks.',4);}}}
    else{tx=s.hx+Math.cos(T*.25+s.ph)*260;ty=s.hy+Math.sin(T*.4+s.ph)*90;spd=1.6;}
    const dx=tx-s.x,dy=ty-s.y,dd=Math.hypot(dx,dy)||1;
    s.vx+=(dx/dd*spd-s.vx)*k*fr;s.vy+=(dy/dd*spd-s.vy)*k*fr;
    s.x+=s.vx*fr;s.y+=s.vy*fr;
    if(s.x<760){s.x=760;s.vx=Math.abs(s.vx);}if(s.x>WW-80)s.x=WW-80;
    s.y=clamp(s.y,70,fy(s.x)-45);
    if(Math.abs(s.vx)>.2)s.ang=angLerp(s.ang,Math.atan2(s.vy,s.vx),.08*fr);
  }
  // babies
  const followers=babies.filter(b=>b.state==='following').sort((a,b)=>a.order-b.order);
  for(const b of babies){
    const ox=b.x,oy=b.y;
    if(b.state==='lost'){
      b.x=b.bx+Math.sin(T*.7+b.ph)*40;b.y=b.by+Math.sin(T*1.3+b.ph)*14;
      b.bubT-=dt;if(b.bubT<=0){b.bubT=.5;parts.push({x:b.x,y:b.y-10,vx:rand(-.3,.3),vy:-.7,life:2,max:2,type:'bub',size:rand(2,4)});}
      if(dist(b.x,b.y,P.x,P.y)<120){b.state='following';b.order=followers.length;followers.push(b);SFX.baby();burst(b.x,b.y,10,'#ffd1e8');
        toast(flags.found?'Another baby! Lead it home.':'You found a baby! Lead it home to the reef ←',4);flags.found=1;}
    } else if(b.state==='following'){
      const idx=followers.indexOf(b);const lead=idx===0?P.spine[P.spine.length-1]:followers[idx-1].spine[followers[idx-1].spine.length-1];
      const dx=lead.x-b.x,dy=lead.y-b.y,d=Math.hypot(dx,dy)||1;
      if(d>700){b.x=lead.x;b.y=lead.y;makeSpine(b,14,4);}
      else{const s=d>26?Math.min(7,d*.05+.6):0;b.vx+=(dx/d*s-b.vx)*.15*fr;b.vy+=(dy/d*s-b.vy)*.15*fr;b.x+=b.vx*fr;b.y+=b.vy*fr;}
      b.y=clamp(b.y,25,fy(b.x)-12);
    } else {
      b.x=NEST.x+Math.cos(T*.8+b.ph)*95;b.y=NEST.y-30+Math.sin(T*1.6+b.ph)*28;
    }

    const cc=b.vx;if(cc>.1)b.s=1;else if(cc<-.1)b.s=-1;

  }

    followers.forEach(b=>{b.state='home';burst(b.x,b.y,14,'#ffe27a');});

  }
  // crystals
  for(const g of crystals){if(!g.found&&dist(g.x,g.y,P.x,P.y)<62){g.found=true;stats.crystals++;SFX.gem();burst(g.x,g.y,16,'#e3c8ff');
    const f=FACTS[g.fact];stopPlay('paused');showCard(`<div class="gem">💎</div><h2>${f[0]}</h2><p>${f[1]}</p><p class="ctrl">Crystal ${stats.crystals} of 8</p><button data-a="resume">Cool!</button>`);return;}}
  // toasts
  if(toasts.length){toasts[0].t-=dt;if(toasts[0].t<=0)toasts.shift();}
  // camera
  const vw=W/scale,vh=H/scale;
  const tx=clamp(P.x+P.vx*18-vw/2,0,Math.max(0,WW-vw)),ty=clamp(P.y-vh/2,-380,Math.max(-380,WH-vh));
  cam.x+=(tx-cam.x)*Math.min(1,.08*fr);cam.y+=(ty-cam.y)*Math.min(1,.08*fr);
  // death / win
  if(P.hp<=0){P.hp=0;stopPlay('dead');showCard(`<h2>Whew, Mosa is tired!</h2><p>Let's rest at the home reef and try again. Your babies are still with you.</p><button data-a="respawn">Keep Going</button>`);}

}
function splash(x,v){SFX.splash();for(let i=0;i<14+v*2;i++)parts.push({x:x+rand(-20,20),y:0,vx:rand(-3,3),vy:rand(-3,-1)-v*.4,life:rand(.6,1.1),max:1.1,type:'drop',size:rand(2,4)});}
function burst(x,y,n,col='#ffffff'){for(let i=0;i<n;i++){const a=rand(0,6.28),s=rand(.5,3);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(.4,.8),max:.8,type:'spark',size:rand(2,4),col});}}
function updateFx(dt){
  const fr=dt*60;
  for(const p of parts){p.life-=dt;if(p.type==='bub'){p.x+=(p.vx+Math.sin(T*4+p.size)*.3)*fr;p.y+=p.vy*fr;if(p.y<2)p.life=0;}else if(p.type==='drop'){p.vy+=.25*fr;p.x+=p.vx*fr;p.y+=p.vy*fr;if(p.y>2&&p.vy>0)p.life=0;}else{p.x+=p.vx*fr;p.y+=p.vy*fr;p.vx*=.94;p.vy*=.94;}}
  parts=parts.filter(p=>p.life>0);if(parts.length>400)parts.splice(0,parts.length-400);
  for(const r of rings){r.r+=900*dt;r.life-=dt;}rings=rings.filter(r=>r.life>0);
  for(const s of snow){s.y+=s.s*.15*fr;}
}

// ---------- DRAW ----------
function setWorld(){ctx.setTransform(DPR*scale,0,0,DPR*scale,-cam.x*scale*DPR,-cam.y*scale*DPR);}
function setScreen(){ctx.setTransform(DPR,0,0,DPR,0,0);}
let waterGrad=null,skyGrad=null;
function draw(){
  const vw=W/scale,vh=H/scale,x0=cam.x-50,x1=cam.x+vw+50;
  setWorld();
  if(!waterGrad){waterGrad=ctx.createLinearGradient(0,0,0,WH);waterGrad.addColorStop(0,'#35acd9');waterGrad.addColorStop(.22,'#1878b0');waterGrad.addColorStop(.6,'#0b3f72');waterGrad.addColorStop(1,'#041a33');
    skyGrad=ctx.createLinearGradient(0,-900,0,0);skyGrad.addColorStop(0,'#6cc4f5');skyGrad.addColorStop(1,'#d6f1ff');}
  // sky
  if(cam.y<0){ctx.fillStyle=skyGrad;ctx.fillRect(x0,-1000,x1-x0,1010);
    ctx.fillStyle='rgba(255,244,190,.9)';ctx.beginPath();ctx.arc(cam.x+vw*.8,-520,60,0,7);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.85)';for(let i=0;i<10;i++){const cx=((i*733+T*8)%(WW+400))-200,cy=-600+((i*97)%300);if(cx>x0-150&&cx<x1+150){ctx.beginPath();ctx.ellipse(cx,cy,70,22,0,0,7);ctx.ellipse(cx+40,cy-12,45,20,0,0,7);ctx.ellipse(cx-35,cy-6,40,16,0,0,7);ctx.fill();}}}
  // water
  ctx.fillStyle=waterGrad;ctx.beginPath();ctx.moveTo(x0,WH+200);for(let x=x0;x<=x1;x+=20)ctx.lineTo(x,Math.sin(x/60+T*2)*4+Math.sin(x/23+T*3)*1.5);ctx.lineTo(x1,WH+200);ctx.closePath();ctx.fill();
  // far layer (screen space)
  setScreen();
  ctx.fillStyle='rgba(4,24,48,.5)';ctx.beginPath();ctx.moveTo(0,H);
  for(let sx=0;sx<=W+16;sx+=16){const wx=(cam.x+sx/scale)*.6+3000;const h=1180+170*Math.sin(wx/400)+80*Math.sin(wx/140);ctx.lineTo(sx,(h-cam.y*.85-160)*scale);}
  ctx.lineTo(W,H);ctx.closePath();ctx.fill();
  // marine snow
  ctx.fillStyle='rgba(220,240,255,.35)';
  for(const s of snow){const sx=((s.x-cam.x*scale*.7)%W+W)%W,sy=((s.y-cam.y*scale*.7)%H+H)%H;if(cam.y+sy/scale>40)ctx.fillRect(sx,sy,s.s,s.s);}
  setWorld();
  // light rays
  if(cam.y<800){for(let rx=Math.floor(x0/260)*260;rx<x1;rx+=260){const sw=Math.sin(T*.5+rx)*40;const g=ctx.createLinearGradient(0,0,0,750);g.addColorStop(0,'rgba(255,255,255,.12)');g.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(rx-20,0);ctx.lineTo(rx+35,0);ctx.lineTo(rx+35+220+sw,750);ctx.lineTo(rx-20+120+sw,750);ctx.closePath();ctx.fill();}}
  // surface line
  ctx.strokeStyle='rgba(255,255,255,.6)';ctx.lineWidth=3;ctx.beginPath();for(let x=x0;x<=x1;x+=20){const y=Math.sin(x/60+T*2)*4+Math.sin(x/23+T*3)*1.5;x===x0?ctx.moveTo(x,y):ctx.lineTo(x,y);}ctx.stroke();
  // nest glow
  if(NEST.x+400>x0){const g=ctx.createRadialGradient(NEST.x,NEST.y,10,NEST.x,NEST.y,260);g.addColorStop(0,'rgba(120,255,200,.25)');g.addColorStop(1,'rgba(120,255,200,0)');ctx.fillStyle=g;ctx.fillRect(NEST.x-260,NEST.y-260,520,520);}
  // kelp behind
  for(const k of kelp){if(k.x<x0||k.x>x1)continue;const by=fy(k.x)+6;ctx.strokeStyle=k.c;ctx.lineWidth=5;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(k.x,by);for(let j=1;j<=6;j++){ctx.lineTo(k.x+Math.sin(T*1.2+k.ph+j*.6)*j*3,by-k.h*j/6);}ctx.stroke();
    ctx.fillStyle=k.c;for(let j=2;j<=6;j+=2){const lx=k.x+Math.sin(T*1.2+k.ph+j*.6)*j*3,ly=by-k.h*j/6;ctx.beginPath();ctx.ellipse(lx+6,ly,9,3.5,.5,0,7);ctx.fill();}}
  // terrain
  const tg=ctx.createLinearGradient(0,600,0,WH);tg.addColorStop(0,'#3a5f63');tg.addColorStop(1,'#0c1f2a');
  ctx.fillStyle=tg;ctx.beginPath();ctx.moveTo(x0,WH+300);for(let x=x0;x<=x1+20;x+=20)ctx.lineTo(x,fy(x));ctx.lineTo(x1+20,WH+300);ctx.closePath();ctx.fill();
  ctx.strokeStyle='rgba(230,210,150,.45)';ctx.lineWidth=5;ctx.beginPath();for(let x=x0;x<=x1+20;x+=20){x===x0?ctx.moveTo(x,fy(x)):ctx.lineTo(x,fy(x));}ctx.stroke();
  for(const r of rocks){if(r.x<x0-80||r.x>x1+80)continue;ctx.fillStyle=r.c;ctx.beginPath();ctx.ellipse(r.x,fy(r.x)+r.ry*.3,r.rx,r.ry,0,Math.PI,0);ctx.fill();}
  // corals
  for(const c of corals){if(c.x>x1)continue;ctx.fillStyle=c.c;const sw=Math.sin(T*1.5+c.ph)*2;ctx.beginPath();ctx.arc(c.x+sw,c.y-c.r*.6,c.r*.6,0,7);ctx.arc(c.x-c.r*.5+sw,c.y-c.r*1.1,c.r*.45,0,7);ctx.arc(c.x+c.r*.5+sw,c.y-c.r*1.2,c.r*.4,0,7);ctx.fill();}
  if(NEST.x<x1){ctx.fillStyle='rgba(255,255,255,.85)';ctx.font='700 22px Fredoka, sans-serif';ctx.textAlign='center';ctx.fillText('HOME REEF',NEST.x,NEST.y-120);}

  // ammonites
  for(const a of ammos){if(!a.alive||a.x<x0||a.x>x1)continue;drawAmmo(a);}
  // fish
  for(const f of fish){if(!f.alive||f.x<x0||f.x>x1)continue;drawFish(f);}
  // sharks
  for(const s of sharks){if(s.x<x0-100||s.x>x1+100)continue;drawShark(s);}
  // babies
  for(const b of babies){if(b.x<x0-100||b.x>x1+100)continue;drawMosa(b,.42,BABY,.15+Math.max(0,Math.sin(T*3+b.ph))*.3);if(b.state==='lost'){ctx.fillStyle='#fff';ctx.font='700 22px Fredoka, sans-serif';ctx.textAlign='center';ctx.fillText('?',b.x,b.y-26+Math.sin(T*4)*3);}}
  // player
  if(!(P.inv>0&&Math.floor(T*12)%2===0))drawMosa(P,1,ADULT,P.mouth);
  // particles
  for(const p of parts){const a=Math.max(0,p.life/p.max);if(p.type==='bub'){ctx.strokeStyle=`rgba(220,245,255,${a*.8})`;ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,7);ctx.stroke();}else if(p.type==='drop'){ctx.fillStyle=`rgba(230,250,255,${a})`;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,7);ctx.fill();}else{ctx.globalAlpha=a;ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,7);ctx.fill();ctx.globalAlpha=1;}}
  for(const r of rings){ctx.strokeStyle=`rgba(180,240,255,${r.life/1.4*.7})`;ctx.lineWidth=4;ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,7);ctx.stroke();}

  setScreen();

  if(depth>.01){const px=(P.x-cam.x)*scale,py=(P.y-cam.y)*scale;const g=ctx.createRadialGradient(px,py,140*scale,px,py,Math.max(W,H)*.8);g.addColorStop(0,'rgba(0,8,20,0)');g.addColorStop(1,`rgba(0,8,20,${depth})`);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);}
  if(state!=='title')hud();
}

const ADULT={body:'#2f7f8f',belly:'#eadfb4',spot:'#225f6c',far:'#215663'};
const BABY={body:'#5fc6cc',belly:'#fff3d2',spot:'#3fa1a8',far:'#4aa7ad',cheek:true};
function drawMosa(o,k,col,mouth){
  const sp=o.spine,n=sp.length,s=o.s;
  const spd=Math.hypot(o.vx||0,o.vy||0);
  const amp=(.8+Math.min(spd,6)*1.0)*Math.max(k,.5);
  const Q=[];
  for(let i=0;i<n;i++){
    const a=sp[Math.max(0,i-1)],b=sp[Math.min(n-1,i+1)];let fx=a.x-b.x,fy2=a.y-b.y;const l=Math.hypot(fx,fy2)||1;fx/=l;fy2/=l;
    const bx=-fy2*s,by=fx*s,u=i/(n-1);const wv=Math.sin(T*6-i*.5)*amp*u;
    const w=k*(u<.2?13+u*25:18*Math.pow(1-(u-.2)/.8,1.15)+2);
    Q.push({x:sp[i].x+bx*wv,y:sp[i].y+by*wv,bx,by,w,fx,fy:fy2});
  }
  const flip=(p,i,color,extra)=>{const sa=Math.atan2(p.fy,p.fx);ctx.save();ctx.translate(p.x+p.bx*p.w*.55,p.y+p.by*p.w*.55);ctx.rotate(sa+Math.PI-s*(.75+extra+Math.sin(T*4+i)*.25));ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(13*k,0,13*k,4.5*k,0,0,7);ctx.fill();ctx.restore();};
  const f1=3,f2=Math.floor(n*.55);
  flip(Q[f1],1,col.far,-.35);flip(Q[f2],2,col.far,-.35);
  // tail fluke
  {const pl=Q[n-1],pv=Q[n-2],tb=Math.atan2(pl.y-pv.y,pl.x-pv.x);const sy=(-Math.sin(tb)*pl.bx+Math.cos(tb)*pl.by)>0?1:-1;
    ctx.save();ctx.translate(pl.x,pl.y);ctx.rotate(tb+Math.sin(T*6)*.15);ctx.scale(k,k*sy);ctx.fillStyle=col.body;ctx.beginPath();ctx.moveTo(-6,-3);ctx.quadraticCurveTo(12,2,30,26);ctx.quadraticCurveTo(20,10,22,0);ctx.quadraticCurveTo(24,-6,28,-12);ctx.quadraticCurveTo(10,-8,-6,-3);ctx.fill();ctx.restore();}
  // body
  ctx.fillStyle=col.body;ctx.beginPath();
  for(let i=0;i<n;i++){const p=Q[i];const x=p.x-p.bx*p.w,y=p.y-p.by*p.w;i?ctx.lineTo(x,y):ctx.moveTo(x,y);}
  for(let i=n-1;i>=0;i--){const p=Q[i];ctx.lineTo(p.x+p.bx*p.w,p.y+p.by*p.w);}
  ctx.closePath();ctx.fill();
  ctx.fillStyle=col.belly;ctx.beginPath();
  for(let i=0;i<n;i++){const p=Q[i];const x=p.x+p.bx*p.w,y=p.y+p.by*p.w;i?ctx.lineTo(x,y):ctx.moveTo(x,y);}
  for(let i=n-1;i>=0;i--){const p=Q[i];ctx.lineTo(p.x+p.bx*p.w*.25,p.y+p.by*p.w*.25);}
  ctx.closePath();ctx.fill();
  ctx.fillStyle=col.spot;for(let i=2;i<n-3;i+=2){const p=Q[i];ctx.beginPath();ctx.arc(p.x-p.bx*p.w*.5,p.y-p.by*p.w*.5,Math.max(1,p.w*.18),0,7);ctx.fill();}
  flip(Q[f1],3,col.body,0);flip(Q[f2],4,col.body,0);
  // head
  const p0=Q[0],ha=Math.atan2(p0.fy,p0.fx),m=clamp(mouth,0,1)*.55;
  ctx.save();ctx.translate(p0.x,p0.y);ctx.rotate(ha);ctx.scale(k,k*s);
  if(m>.03){ctx.fillStyle='#6a1428';ctx.beginPath();ctx.moveTo(2,2);ctx.lineTo(54,1);ctx.lineTo(4+46*Math.cos(m),2+46*Math.sin(m));ctx.closePath();ctx.fill();}
  ctx.save();ctx.translate(4,2);ctx.rotate(m);
  ctx.fillStyle=col.belly;ctx.beginPath();ctx.moveTo(-10,-1);ctx.lineTo(46,-1);ctx.quadraticCurveTo(44,4,36,6);ctx.quadraticCurveTo(12,11,-10,9);ctx.closePath();ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();for(let x=8;x<=40;x+=6){ctx.moveTo(x,-1);ctx.lineTo(x+2,-5);ctx.lineTo(x+4,-1);}ctx.fill();
  ctx.restore();
  ctx.fillStyle=col.body;ctx.beginPath();ctx.moveTo(-8,-13);ctx.quadraticCurveTo(16,-18,36,-9);ctx.quadraticCurveTo(52,-4,56,0);ctx.quadraticCurveTo(54,3,48,3);ctx.lineTo(-8,6);ctx.closePath();ctx.fill();
  if(m>.08){ctx.fillStyle='#fff';ctx.beginPath();for(let x=10;x<=46;x+=6){ctx.moveTo(x,2.5);ctx.lineTo(x+2,6.5);ctx.lineTo(x+4,2.5);}ctx.fill();}
  ctx.fillStyle=col.spot;ctx.beginPath();ctx.arc(46,-4,1.4,0,7);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(13,-6,col.cheek?5:3.8,0,7);ctx.fill();
  ctx.fillStyle='#10202a';ctx.beginPath();ctx.arc(14,-6,col.cheek?3:2.2,0,7);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(14.8,-7,col.cheek?1.2:.8,0,7);ctx.fill();
  if(col.cheek){ctx.fillStyle='rgba(255,130,170,.55)';ctx.beginPath();ctx.arc(20,0,3.5,0,7);ctx.fill();}
  ctx.restore();
}
function drawShark(s){
  ctx.save();ctx.translate(s.x,s.y);ctx.rotate(s.ang);if(Math.cos(s.ang)<0)ctx.scale(1,-1);
  const tw=Math.sin(T*(s.dizzy>0?2:7)+s.ph)*5;
  ctx.fillStyle='#5f7887';
  ctx.beginPath();ctx.moveTo(5,-15);ctx.lineTo(-14,-40);ctx.lineTo(-22,-14);ctx.fill();
  ctx.beginPath();ctx.moveTo(56,0);ctx.quadraticCurveTo(42,-18,2,-17);ctx.quadraticCurveTo(-34,-14,-50,-4);ctx.lineTo(-74,-28+tw);ctx.lineTo(-64,0+tw*.5);ctx.lineTo(-74,20+tw);ctx.lineTo(-50,4);ctx.quadraticCurveTo(-20,16,10,14);ctx.quadraticCurveTo(46,10,56,0);ctx.fill();
  ctx.fillStyle='#d5dde2';ctx.beginPath();ctx.moveTo(50,3);ctx.quadraticCurveTo(30,12,0,13);ctx.quadraticCurveTo(-25,12,-46,4);ctx.quadraticCurveTo(0,4,50,3);ctx.fill();
  ctx.fillStyle='#4f6878';ctx.beginPath();ctx.moveTo(16,8);ctx.lineTo(-2,30);ctx.lineTo(-6,10);ctx.fill();
  ctx.strokeStyle='#41596a';ctx.lineWidth=1.5;for(let i=0;i<3;i++){ctx.beginPath();ctx.moveTo(22-i*5,-6);ctx.lineTo(20-i*5,4);ctx.stroke();}
  ctx.strokeStyle='#2c3e4a';ctx.beginPath();ctx.moveTo(52,3);ctx.quadraticCurveTo(44,7,36,6);ctx.stroke();
  if(s.dizzy>0){ctx.strokeStyle='#10202a';ctx.lineWidth=1.6;ctx.beginPath();ctx.moveTo(36,-8);ctx.lineTo(42,-2);ctx.moveTo(42,-8);ctx.lineTo(36,-2);ctx.stroke();}
  else{ctx.fillStyle='#10202a';ctx.beginPath();ctx.arc(39,-5,2.6,0,7);ctx.fill();}
  ctx.restore();
  if(s.dizzy>0){for(let j=0;j<3;j++){const a=T*4+j*2.1;star(s.x+Math.cos(a)*32,s.y-34+Math.sin(a)*9,6);}}
}
function star(x,y,r){ctx.fillStyle='#ffe96b';ctx.beginPath();for(let i=0;i<10;i++){const a=i*Math.PI/5-Math.PI/2,rr=i%2?r*.45:r;ctx.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr);}ctx.closePath();ctx.fill();}
function drawFish(f){
  ctx.save();ctx.translate(f.x,f.y);ctx.rotate(Math.atan2(f.vy,f.vx));if(f.vx<0)ctx.scale(1,-1);
  const z=f.size,w=Math.sin(T*10+f.ph)*z*.25;
  ctx.fillStyle=f.sc.col;ctx.beginPath();ctx.ellipse(0,0,z,z*.45,0,0,7);ctx.fill();
  ctx.beginPath();ctx.moveTo(-z*.8,0);ctx.lineTo(-z*1.6,-z*.55+w);ctx.lineTo(-z*1.6,z*.55+w);ctx.closePath();ctx.fill();
  ctx.fillStyle='#10202a';ctx.beginPath();ctx.arc(z*.5,-z*.1,z*.13,0,7);ctx.fill();
  ctx.restore();
}
function drawAmmo(a){
  ctx.save();ctx.translate(a.x,a.y);const r=a.r;const dir=Math.sin(T*.2+a.ph)>0?1:-1;ctx.scale(dir,1);
  ctx.strokeStyle='#d89a5b';ctx.lineWidth=2.4;ctx.lineCap='round';
  for(let i=0;i<5;i++){ctx.beginPath();ctx.moveTo(r*.8,r*.2);ctx.quadraticCurveTo(r*1.4,r*.2+i*3,r*1.7+Math.sin(T*3+i+a.ph)*3,r*.1+i*4-4);ctx.stroke();}
  ctx.fillStyle='#f2c98a';ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.fill();
  ctx.strokeStyle='#a8683a';ctx.lineWidth=1.6;ctx.beginPath();for(let t=0;t<12;t+=.2){const rr=r*(1-t/13);const ang=-t*1.1;t?ctx.lineTo(Math.cos(ang)*rr*.9,Math.sin(ang)*rr*.9):ctx.moveTo(Math.cos(ang)*rr*.9,Math.sin(ang)*rr*.9);}ctx.stroke();
  for(let i=0;i<10;i++){const ang=i*.63;ctx.beginPath();ctx.moveTo(Math.cos(ang)*r*.55,Math.sin(ang)*r*.55);ctx.lineTo(Math.cos(ang)*r,Math.sin(ang)*r);ctx.stroke();}
  ctx.restore();
}
function drawCrystal(g){
  const p=1+Math.sin(T*3+g.ph)*.12,y=g.y+Math.sin(T*1.5+g.ph)*6;
  ctx.save();ctx.translate(g.x,y);ctx.globalAlpha=g.found?.3:1;
  if(!g.found){const gr=ctx.createRadialGradient(0,0,4,0,0,60*p);gr.addColorStop(0,'rgba(210,160,255,.6)');gr.addColorStop(1,'rgba(210,160,255,0)');ctx.fillStyle=gr;ctx.fillRect(-60*p,-60*p,120*p,120*p);}
  ctx.scale(p,p);ctx.fillStyle='#c6a2ff';ctx.strokeStyle='#fff';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(0,-22);ctx.lineTo(13,0);ctx.lineTo(0,22);ctx.lineTo(-13,0);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.7)';ctx.beginPath();ctx.moveTo(0,-18);ctx.lineTo(6,-2);ctx.lineTo(0,2);ctx.closePath();ctx.fill();
  ctx.restore();
}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function bar(x,y,w,v,c1,label){ctx.fillStyle='rgba(0,20,40,.55)';rr(x,y,w+52,22,11);ctx.fill();ctx.fillStyle='#fff';ctx.font='700 13px Fredoka, sans-serif';ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillText(label,x+9,y+11.5);ctx.fillStyle='rgba(255,255,255,.18)';rr(x+44,y+5,w,12,6);ctx.fill();if(v>0){ctx.fillStyle=c1;rr(x+44,y+5,Math.max(12,w*v/100),12,6);ctx.fill();}}
function hud(){
  const u=clamp(W/640,.8,1.25);ctx.setTransform(DPR*u,0,0,DPR*u,0,0);const SW=W/u,SH=H/u;
  const hc=P.hp>50?'#6ee36e':P.hp>25?'#ffd24d':'#ff5e5e';
  bar(12,12,130,P.hp,hc,'❤️');
  const airLow=P.air<25&&Math.floor(T*4)%2===0;
  bar(12,40,130,P.air,airLow?'#ff7a7a':'#7fdcff','AIR');
  // babies
  const bx=SW-12-150;ctx.fillStyle='rgba(0,20,40,.55)';rr(bx,12,150,50,14);ctx.fill();
  ctx.fillStyle='#fff';ctx.font='700 13px Fredoka, sans-serif';ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillText('BABIES',bx+10,24);ctx.fillText('💎 '+stats.crystals+'/8',bx+86,24);
  babies.forEach((b,i)=>{const cx=bx+20+i*24,cy=46;ctx.beginPath();ctx.arc(cx,cy,8,0,7);if(b.state==='home'){ctx.fillStyle='#ffe27a';ctx.fill();}else if(b.state==='following'){ctx.fillStyle='#5fc6cc';ctx.fill();}else{ctx.strokeStyle='rgba(255,255,255,.6)';ctx.lineWidth=2;ctx.stroke();}});
  // low air hint
  if(P.air<30&&P.y>28){ctx.setTransform(DPR,0,0,DPR,0,0);const px=(P.x-cam.x)*scale,py=(P.y-cam.y)*scale-80*scale;ctx.globalAlpha=.6+Math.sin(T*8)*.4;ctx.fillStyle='#fff';ctx.font=`700 ${Math.round(20*u)}px Fredoka, sans-serif`;ctx.textAlign='center';ctx.fillText('⬆ AIR',px,py);ctx.globalAlpha=1;ctx.setTransform(DPR*u,0,0,DPR*u,0,0);}
  // sonar arrows
  if(P.sonarT>0){ctx.setTransform(DPR,0,0,DPR,0,0);const a=Math.min(1,P.sonarT);
    const tg=[];babies.forEach(b=>{if(b.state==='lost')tg.push({x:b.x,y:b.y,c:'#ffb347'});});
    if(babies.some(b=>b.state==='following'))tg.push({x:NEST.x,y:NEST.y,c:'#7dffc4'});
    for(const t of tg){const sx=(t.x-cam.x)*scale,sy=(t.y-cam.y)*scale,m=46;
      ctx.globalAlpha=a;
      if(sx>m&&sx<W-m&&sy>m&&sy<H-m){ctx.strokeStyle=t.c;ctx.lineWidth=4;ctx.beginPath();ctx.arc(sx,sy,30+Math.sin(T*6)*5,0,7);ctx.stroke();}
      else{const cx=W/2,cy=H/2,dx=sx-cx,dy=sy-cy,k=Math.min((W/2-m)/Math.abs(dx||1),(H/2-m)/Math.abs(dy||1));const ax=cx+dx*k,ay=cy+dy*k,an=Math.atan2(dy,dx);
        ctx.save();ctx.translate(ax,ay);ctx.rotate(an);ctx.fillStyle=t.c;ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(22,0);ctx.lineTo(-12,-16);ctx.lineTo(-5,0);ctx.lineTo(-12,16);ctx.closePath();ctx.stroke();ctx.fill();ctx.restore();}
      ctx.globalAlpha=1;}
    ctx.setTransform(DPR*u,0,0,DPR*u,0,0);}
  // toast
  if(toasts.length){const t=toasts[0];ctx.font='600 17px Fredoka, sans-serif';const tw=Math.min(ctx.measureText(t.txt).width+36,SW-24);const tx=SW/2-tw/2,ty=SH*.14+40;ctx.globalAlpha=Math.min(1,t.t*3);ctx.fillStyle='rgba(8,40,70,.85)';rr(tx,ty,tw,36,18);ctx.fill();ctx.strokeStyle='#8fe3ff';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(t.txt,SW/2,ty+18,tw-20);ctx.globalAlpha=1;}
  setScreen();
}

// ---------- LOOP ----------
let last=0;
function loop(ts){const now=ts/1000;const dt=Math.min(.05,now-(last||now));last=now;T+=dt;
  if(state==='play')update(dt);
  if(state==='title'){cam.x=200+Math.sin(T*.1)*150;cam.y=150;}
  updateFx(dt);draw();requestAnimationFrame(loop);}
newGame();titleCard();requestAnimationFrame(loop);
})();
</script>
